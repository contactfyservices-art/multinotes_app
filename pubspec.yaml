name: multinotes_app
description: "Application de notes multi-tableaux avec rappels, checklists, pièces jointes et mode bulle flottante."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Stockage local des notes (rapide, pas besoin de serveur)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Notifications / rappels (alarmes de notes)
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Calendrier
  table_calendar: ^3.0.9

  # Pièces jointes : image, audio, vidéo
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  record: ^5.0.4
  audioplayers: ^6.0.0
  video_player: ^2.8.6

  # Localisation (joindre les coordonnées GPS à une note)
  geolocator: ^11.0.0

  # Sécurité (mot de passe / verrouillage de note ou d'appli)
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # Permissions (nécessaire pour le mode bulle / overlay)
  permission_handler: ^11.3.1

  # MODE BULLE / FLOATING APP (fenêtre par-dessus les autres applis)
  flutter_overlay_window: ^0.4.5

  # Polices illimitées façon "Style de texte"
  google_fonts: ^6.2.1

  # Partager une note
  share_plus: ^9.0.0

  # Ouvrir WhatsApp / e-mail depuis l'écran "À propos"
  url_launcher: ^6.3.0

  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
