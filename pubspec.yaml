name: multinotes_app
description: "Application de notes multi-tableaux avec rappels, checklists, pièces jointes et mode bulle flottante."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Stockage local des notes
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Notifications / rappels
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Calendrier
  table_calendar: ^3.0.9

  # Pièces jointes : image, audio, vidéo
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  record: ^5.0.4
  audioplayers: ^6.0.0
  video_player: ^2.8.6

  # Localisation
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    
