name: multinotes_app
description: "Application de notes multi-tableaux avec rappels, checklists et pièces jointes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  table_calendar: ^3.0.9

  image_picker: ^1.0.7
  file_picker: ^6.1.1

  crypto: ^3.0.3

  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
